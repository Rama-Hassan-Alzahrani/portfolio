<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Illustrated avatar of Rama: long dark brown hair -->
  <rect width="200" height="200" fill="#eee8ff"/>
  <circle cx="160" cy="45" r="22" fill="#e2559a" opacity="0.35"/>
  <circle cx="35" cy="150" r="14" fill="#6c4fe0" opacity="0.3"/>
  <!-- hair (back, long) -->
  <path d="M52 100 Q50 38 100 36 Q150 38 148 100 L154 168 Q128 182 100 180 Q72 182 46 168 Z" fill="#4a2c1f"/>
  <!-- shirt -->
  <path d="M38 200 Q42 152 100 148 Q158 152 162 200 Z" fill="#e2559a"/>
  <path d="M84 150 Q100 166 116 150" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="91" y="120" width="18" height="30" rx="7" fill="#e9b996"/>
  <!-- face -->
  <ellipse cx="100" cy="94" rx="31" ry="36" fill="#f3c9a8"/>
  <!-- bangs, side swept -->
  <path d="M66 96 Q62 50 102 50 Q140 52 136 96 Q128 70 104 66 Q84 66 66 96 Z" fill="#5a3726"/>
  <!-- hair strands in front of shoulders -->
  <path d="M66 96 Q60 140 70 170 L58 168 Q50 130 56 100 Z" fill="#4a2c1f"/>
  <path d="M136 96 Q142 140 132 170 L144 168 Q152 130 146 100 Z" fill="#4a2c1f"/>
  <!-- eyes -->
  <ellipse cx="88" cy="98" rx="3.6" ry="4.4" fill="#2b1a14"/>
  <ellipse cx="112" cy="98" rx="3.6" ry="4.4" fill="#2b1a14"/>
  <circle cx="89.2" cy="96.6" r="1.2" fill="#ffffff"/>
  <circle cx="113.2" cy="96.6" r="1.2" fill="#ffffff"/>
  <!-- brows -->
  <path d="M81 88 Q88 84 94 87" fill="none" stroke="#4a2c1f" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M106 87 Q112 84 119 88" fill="none" stroke="#4a2c1f" stroke-width="2.4" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="80" cy="110" rx="6" ry="3.5" fill="#f08f8f" opacity="0.45"/>
  <ellipse cx="120" cy="110" rx="6" ry="3.5" fill="#f08f8f" opacity="0.45"/>
  <!-- smile -->
  <path d="M92 114 Q100 121 108 114" fill="none" stroke="#a5523f" stroke-width="2.6" stroke-linecap="round"/>
  <!-- small earring -->
  <circle cx="69" cy="108" r="2.6" fill="#6c4fe0"/>
  <circle cx="131" cy="108" r="2.6" fill="#6c4fe0"/>
</svg>
